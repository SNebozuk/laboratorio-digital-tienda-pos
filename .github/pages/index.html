<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio Digital · Vistas previas</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #101010; color: #f5f5f5; }
    main { width: min(92vw, 680px); padding: 40px; border: 1px solid #303030; border-radius: 18px; background: #181818; box-shadow: 0 20px 70px #0008; }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 5vw, 42px); }
    p { color: #bcbcbc; line-height: 1.55; }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 28px; }
    a { display: block; padding: 18px; border-radius: 12px; background: #f4c542; color: #151515; font-weight: 750; text-decoration: none; text-align: center; }
    a:last-child { background: #2b2b2b; color: #fff; border: 1px solid #484848; }
    small { display: block; margin-top: 24px; color: #858585; }
  </style>
</head>
<body>
  <main>
    <h1>Laboratorio Digital</h1>
    <p>Vistas previas públicas para revisar el diseño desde cualquier navegador.</p>
    <nav>
      <a href="./tienda/">Ver tienda</a>
      <a href="./admin/">Ver administración</a>
    </nav>
    <small>Modelos de revisión publicados automáticamente desde GitHub.</small>
  </main>
</body>
</html>
