name: Aplicar actualizacion de Codex

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Reemplazar por la version validada
        shell: bash
        run: |
          mkdir -p /tmp/codex-source
          cp codex-source.tar.gz /tmp/codex-source.tar.gz
          tar -xzf /tmp/codex-source.tar.gz -C /tmp/codex-source
          git ls-files -z | grep -zv '^\.github/' | xargs -0 git rm -f --
          cp -a /tmp/codex-source/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar tienda, POS y seguimiento de pagos"
          git push origin HEAD:main
