name: Publicar vistas previas

on:
  push:
    branches: [main]
    paths:
      - 'outputs/modelo-navegable.html'
      - 'outputs/modelo-administracion.html'
      - '.github/pages/**'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Preparar vistas previas
        run: |
          mkdir -p public/tienda public/admin
          cp .github/pages/index.html public/index.html
          cp outputs/modelo-navegable.html public/tienda/index.html
          cp outputs/modelo-administracion.html public/admin/index.html
          touch public/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir vistas previas
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
