name: Desplegar en Cloud

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    # Permite que el mismo archivo funcione si la rama principal se llama main o master.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verificar configuración del Cloud
        id: configuration
        env:
          CLOUD_HOST: ${{ secrets.LABORATORIO_DIGITAL_CLOUD_HOST }}
          CLOUD_KEY_B64: ${{ secrets.LABORATORIO_DIGITAL_CLOUD_DEPLOY_KEY_B64 }}
        run: |
          if [ -z "$CLOUD_HOST" ] || [ -z "$CLOUD_KEY_B64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "El deploy se omitió: faltan los Secrets del Cloud."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Desplegar versión aprobada por SSH
        if: steps.configuration.outputs.configured == 'true'
        env:
          CLOUD_HOST: ${{ secrets.LABORATORIO_DIGITAL_CLOUD_HOST }}
          CLOUD_KEY_B64: ${{ secrets.LABORATORIO_DIGITAL_CLOUD_DEPLOY_KEY_B64 }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s' "$CLOUD_KEY_B64" | base64 --decode > ~/.ssh/laboratorio_digital_cloud
          chmod 600 ~/.ssh/laboratorio_digital_cloud
          trap 'rm -f ~/.ssh/laboratorio_digital_cloud' EXIT
          ssh -i ~/.ssh/laboratorio_digital_cloud \
            -o StrictHostKeyChecking=accept-new \
            -p 5058 root@"$CLOUD_HOST" \
            '/usr/local/sbin/laboratorio-digital-deploy'
